[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livae-sc"
version = "0.2.5"
description = "LiVAE: Lorentz-regularized interpretable VAE for multi-scale single-cell transcriptomic and epigenomic embeddings"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Zeyu Fu"},
]
keywords = ["single-cell", "variational-autoencoder", "hyperbolic", "lorentz", "bioinformatics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "anndata>=0.10",
  "tqdm>=4.66"
]

[project.optional-dependencies]
app = [
  "fastapi>=0.117",
  "uvicorn[standard]>=0.36",
  "python-multipart>=0.0.6",
  "pydantic>=2.9",
  "scanpy>=1.10",
  "pandas>=2.2"
]
notebooks = [
  "scanpy>=1.10",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "seaborn>=0.13"
]

[tool.setuptools]
packages = ["livae"]

[tool.setuptools.package-data]
livae = ["*.py"]

[project.urls]
Homepage = "https://github.com/PeterPonyu/LiVAE"
Source = "https://github.com/PeterPonyu/LiVAE"
Paper = "https://doi.org/10.3389/fgene.2025.1713727"
Issues = "https://github.com/PeterPonyu/LiVAE/issues"
