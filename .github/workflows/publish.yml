name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine tomli
      
      - name: Verify version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          # Read both version strings as text: importing livae would need torch and the other runtime dependencies.
          PACKAGE_VERSION=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          INIT_VERSION=$(sed -n "s/^__version__ = ['\"]\([^'\"]*\)['\"].*/\1/p" livae/__init__.py)
          echo "Tag version: $TAG_VERSION"
          echo "pyproject.toml version: $PACKAGE_VERSION"
          echo "livae/__init__.py version: $INIT_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
            echo "Error: tag ($TAG_VERSION), pyproject.toml ($PACKAGE_VERSION) and livae/__init__.py ($INIT_VERSION) must match"
            exit 1
          fi
      
      - name: Build distributions
        run: python -m build
      
      - name: Check distributions
        run: python -m twine check dist/*
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/* --non-interactive --verbose
